<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clash Detector</title>
<link rel="stylesheet" href="app.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="app">

  <header class="bar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>Clash Detector</h1>
      <span id="model-name" class="model-name"></span>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="setup" aria-selected="true">Setup</button>
      <button role="tab" data-tab="clashes" aria-selected="false">Clashes
        <span id="tab-count" class="tab-count" hidden></span></button>
    </nav>
  </header>

  <aside id="side">

    <section id="panel-setup" class="panel">
      <div class="pickers">
        <label class="picker"><span class="side-tag a" aria-hidden="true">A</span>
          <select id="model-a" aria-label="Model A" disabled><option>Waiting for Revit</option></select></label>
        <div class="picker-versus" aria-hidden="true">against</div>
        <label class="picker"><span class="side-tag b" aria-hidden="true">B</span>
          <select id="model-b" aria-label="Model B" disabled><option>Waiting for Revit</option></select></label>
        <div class="picker-tools">
          <button id="use-selection" class="link" title="Reads what is selected in Revit now and makes it model A">Use Revit selection as A</button>
          <button id="refresh" class="link" title="Reads the selection and the loaded links again">Refresh from Revit</button>
        </div>
      </div>

      <div class="cat-search">
        <input id="cat-search" type="search" placeholder="Find category" autocomplete="off" aria-label="Find category">
      </div>
      <div class="cat-head">
        <span class="cat-head-label">Category</span>
        <span id="cat-totals" class="cat-totals"></span>
        <button id="all-a" class="toggle a" aria-pressed="false" title="Every category shown, in set A">A</button>
        <button id="all-b" class="toggle b" aria-pressed="false" title="Every category shown, in set B">B</button>
      </div>
      <div id="cat-list" class="cat-list"><div class="none">Waiting for Revit to list the models.</div></div>

      <div class="panel-foot">
        <details class="fold">
          <summary>Presets <span class="fold-count">(4)</span></summary>
          <div class="presets">
            <button class="preset" data-preset="structure-mep"><b>Structure</b> &times; <b>MEP</b></button>
            <button class="preset" data-preset="architecture-mep"><b>Architecture</b> &times; <b>MEP</b></button>
            <button class="preset" data-preset="mep-mep"><b>MEP</b> &times; <b>MEP</b></button>
            <button class="preset" data-preset="everything"><b>Everything</b> &times; <b>everything</b></button>
            <button class="preset quiet" data-preset="clear">Clear both</button>
          </div>
        </details>
        <details class="fold">
          <summary>Options</summary>
          <fieldset class="block">
            <legend>Where to look</legend>
            <label class="choice"><input type="radio" name="scope" value="model">
              <span><b>Whole model</b><small>Every element, in every phase and design option.</small></span></label>
            <label class="choice"><input type="radio" name="scope" value="view">
              <span><b>Active view</b><small id="scope-view-hint"></small></span></label>
          </fieldset>
          <fieldset class="block">
            <legend>Geometry</legend>
            <label class="field">Curved surfaces
              <select id="detail">
                <option value="low">Coarse, fastest</option>
                <option value="medium" selected>Medium</option>
                <option value="high">Fine, slowest</option>
              </select></label>
            <label class="choice"><input type="checkbox" id="context" checked>
              <span><b>Show the surroundings</b><small>Also draws the elements that clash with nothing, so you can see where you are.</small></span></label>
          </fieldset>
        </details>
        <p id="run-hint" class="hint"></p>
        <div class="run-row">
          <label class="tol" title="Clashes shallower than this are left out of the list">Tolerance
            <input id="run-tolerance" type="number" min="0" max="100" step="1" value="0" inputmode="numeric"><span>mm</span></label>
          <button id="run" class="primary" disabled>Run clash test</button>
        </div>
      </div>
    </section>

    <section id="panel-clashes" class="panel" hidden>
      <div class="filters">
        <p id="summary" class="summary"></p>
        <input id="search" type="search" placeholder="Search category, name or element ID" autocomplete="off">
        <div class="row">
          <label class="field">Group by
            <select id="group">
              <option value="pair">Category pair</option>
              <option value="level">Level</option>
              <option value="a">Element in A</option>
              <option value="b">Element in B</option>
              <option value="none">Nothing</option>
            </select></label>
          <label class="field">Sort by
            <select id="sort">
              <option value="depth">Deepest first</option>
              <option value="volume">Largest volume first</option>
              <option value="number">Order found</option>
            </select></label>
        </div>
        <label class="field slider">Ignore clashes shallower than
          <output id="tolerance-value">0 mm</output>
          <input id="tolerance" type="range" min="0" max="100" step="1" value="0"></label>
        <label class="check"><input type="checkbox" id="hide-reviewed"> Hide reviewed</label>
      </div>
      <div id="list" class="list" tabindex="0"></div>
    </section>
  </aside>

  <main id="stage">
    <canvas id="view"></canvas>

    <div id="empty" class="empty">
      <h2>Nothing tested yet</h2>
      <p>Choose what goes in set A and set B, then run the test. Every clash found is listed here and marked in the model.</p>
    </div>

    <div id="legend" class="legend" hidden>
      <button data-layer="a" aria-pressed="true"><span class="swatch a"></span>Set A</button>
      <button data-layer="b" aria-pressed="true"><span class="swatch b"></span>Set B</button>
      <button data-layer="volume" aria-pressed="true"><span class="swatch clash"></span>Overlap</button>
      <button data-layer="markers" aria-pressed="true"><span class="swatch dot"></span>Markers</button>
      <button data-layer="xray" aria-pressed="true" title="See through the two clashing elements">X-ray</button>
      <button id="context-mode" title="How everything else is drawn">Surroundings: faint</button>
    </div>

    <div id="detail-card" class="card" hidden>
      <div class="card-head">
        <span id="card-number" class="number"></span>
        <span id="card-kind" class="kind"></span>
        <button id="card-close" class="icon" title="Deselect (Esc)" aria-label="Deselect">&#x2715;</button>
      </div>
      <dl class="measures">
        <div><dt>Depth</dt><dd id="card-depth"></dd></div>
        <div><dt>Volume</dt><dd id="card-volume"></dd></div>
        <div><dt>Level</dt><dd id="card-level"></dd></div>
      </dl>
      <div class="element a"><span class="swatch a"></span>
        <div><b id="card-a-name"></b><small id="card-a-meta"></small></div></div>
      <div class="element b"><span class="swatch b"></span>
        <div><b id="card-b-name"></b><small id="card-b-meta"></small></div></div>
      <p id="card-note" class="note" hidden></p>
      <div class="card-actions">
        <button id="select-revit" class="primary small">Select in Revit</button>
        <button id="section-revit" class="small" title="Sets the section box of the active 3D view in Revit">Section box in Revit</button>
        <button id="mark-reviewed" class="small" title="R">Mark reviewed</button>
      </div>
      <label class="check"><input type="checkbox" id="follow"> Select in Revit as I move through the list</label>
    </div>

    <div id="toolbar" class="toolbar" hidden>
      <div class="tool-group">
        <button id="prev" title="Previous clash (Up)" aria-label="Previous clash">&#x25C0;</button>
        <span id="position" class="position">-</span>
        <button id="next" title="Next clash (Down)" aria-label="Next clash">&#x25B6;</button>
        <button id="tour" title="Step through the list by itself (Space)" aria-pressed="false">Tour</button>
      </div>
      <div class="tool-group">
        <label class="tool-slider" title="Move the two elements away from each other">Pull apart
          <input id="pull" type="range" min="0" max="1" step="0.01" value="0"></label>
        <button id="pull-play" title="Pull apart and back">Play</button>
      </div>
      <div class="tool-group">
        <label class="tool-slider" title="Cut through the clash">Cut
          <input id="cut" type="range" min="0" max="1" step="0.005" value="0"></label>
        <button id="cut-axis" title="Which way the cut moves">Z</button>
      </div>
      <div class="tool-group">
        <button id="orbit" aria-pressed="false" title="Turn slowly round the clash">Orbit</button>
        <button id="fit-clash" title="Frame the clash (F)">Frame</button>
        <button id="fit-all" title="Frame everything (A)">Show all</button>
      </div>
    </div>

    <div id="hover" class="hover" hidden></div>

    <div id="busy" class="busy" hidden>
      <div class="busy-box">
        <h2 id="busy-stage">Working</h2>
        <div class="meter"><span id="busy-bar"></span></div>
        <p id="busy-count" class="hint"></p>
        <button id="cancel">Stop and show what was found</button>
      </div>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>
  </main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
